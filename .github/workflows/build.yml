name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip app
        run: |
          unzip -o Calorya_GitHub_Auto_APK_Builder.zip
          mv calorya_app/* . 2>/dev/null || mv Calorya*/* . 2>/dev/null || true
          ls -la
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
      
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorya-apk
          path: build/app/outputs/flutter-apk/*.apk
